     <div class="container">
        <div class="row">
            <div class="col-6 offset-3" id="formColumn">
                <div class="card">
                    <div class="card-header">
                        <h4 id="formTitle" class="text-center">Add Movie</h4>
                        <i role="button" class="fa-solid fa-xmark" id="crossMark"></i>
                    </div>
                    <div class="card-body">
                        <form id="form">
                            <div class="row">
                                <div class="col-6">
                                    <label for="title"><b>Title</b></label>
                                    <input id="title" class="form-control mb-4" type="text"
                                        placeholder="Enter Movie Name">
                                </div>
                                <div class="col-6">
                                    <label for="type"><b>Type</b></label>
                                    <input list="movieTypes" class="form-control mb-4" type="text" id="type"
                                        placeholder="Serch movie type...">
                                    <datalist id="movieTypes">
                                        <option value="Action">
                                        <option value="Adventure">
                                        <option value="Animation">
                                        <option value="Comedy">
                                        <option value="Crime">
                                        <option value="Drama">
                                        <option value="Horror">
                                        <option value="Thriller">
                                        <option value="Mystery">
                                        <option value="Romance">
                                        <option value="Sci-Fi">
                                        <option value="Fantasy">
                                        <option value="Historical">
                                        <option value="War">
                                        <option value="Western">
                                        <option value="Documentary">
                                        <option value="Musical">
                                        <option value="Biography">
                                        <option value="Sports">
                                        <option value="Family">
                                        <option value="Psychological">
                                        <option value="Superhero">
                                        <option value="Supernatural">
                                        <option value="Disaster">
                                        <option value="Martial Arts">
                                        <option value="Detective">
                                        <option value="Political">
                                        <option value="Legal / Courtroom">
                                        <option value="Survival">
                                        <option value="Coming-of-Age">
                                        <option value="Dark Comedy">
                                        <option value="Romantic Comedy">
                                        <option value="Action Comedy">
                                        <option value="Crime Thriller">
                                        <option value="Psychological Thriller">
                                        <option value="Horror Comedy">
                                        <option value="Historical Drama">
                                        <option value="Fantasy Adventure">
                                        <option value="Mystery Thriller">
                                        <option value="Satire">
                                    </datalist>
                                </div>

                                <div class="col-12">
                                    <label for="poster"><b>Poster</b></label>
                                    <input id="poster" class="form-control mb-4" type="text"
                                        placeholder="Movie Photo Link">
                                </div>

                                <div class="col-12">
                                    <label for="description"><b>Description</b></label>
                                    <input id="description" class="form-control mb-4" type="text"
                                        placeholder="description">
                                </div>

                                <div class="col-6">
                                    <label for="date"><b>Date</b>(Movie Launch Date)</label>
                                    <input id="date" class="form-control mb-4" type="date"
                                        placeholder="Select launch date">
                                </div>
                                <div class="col-6">
                                    <label for="rating"><b>Rating</b></label>
                                    <select id="rating" class="form-control mb-4" name="" id="">
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                        <option value="7">7</option>
                                        <option value="8">8</option>
                                        <option value="9">9</option>
                                        <option value="10">10</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <div class="d-flex justify-content-between">
                                        <div>
                                            <button id="addBtn" class="btn btn-primary"><b>Add</b></button>
                                            <button id="updateBtn" type="button"
                                                class="btn btn-primary d-none"><b>Update</b></button>
                                        </div>
                                        <div>
                                            <button id="clearBtn" type="button"
                                                class="btn btn-danger"><b>Clear</b></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
     <div id="spinner" class="d-none">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
